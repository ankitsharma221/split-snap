org.gradle.jvmargs=-Xmx8G -XX:MaxMetaspaceSize=4G -XX:ReservedCodeCacheSize=512m -XX:+HeapDumpOnOutOfMemoryError
android.useAndroidX=true
android.enableJetifier=true

# Suppress AGP warning about package attribute in third-party plugin manifests
android.suppressUnsupportedOptionWarnings=android.suppressUnsupportedOptionWarnings
android.overridePathCheck=true

# Allow plugins with old package attribute in their manifests
android.disableAutomaticComponentCreation=false
