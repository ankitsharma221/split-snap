name: split_snap
description: Auto-detect UPI payments and split instantly with friends.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # Database
  sqflite: ^2.3.2
  path: ^1.9.0

  # State management
  flutter_riverpod: ^2.5.1

  # SMS reading (telephony was discontinued — using flutter_sms_inbox instead)
  flutter_sms_inbox: ^1.0.3

  # Background service
  flutter_background_service: ^5.0.5
  flutter_background_service_android: ^6.2.2

  # Floating bubble / overlay
  flutter_overlay_window: ^0.3.0

  # Location
  geolocator: ^12.0.0
  geocoding: ^3.0.0

  # WiFi name
  network_info_plus: ^6.0.1

  # Contacts
  flutter_contacts: ^1.1.9+1

  # Local notifications
  flutter_local_notifications: ^17.2.2

  # Permissions
  permission_handler: ^11.3.1

  # Image picker (for photo attach)
  image_picker: ^1.1.2

  # URL launcher (WhatsApp)
  url_launcher: ^6.3.0

  # Intl (date formatting)
  intl: ^0.19.0

  # Shared preferences (settings)
  shared_preferences: ^2.3.2

  # Icons
  cupertino_icons: ^1.0.8

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/
